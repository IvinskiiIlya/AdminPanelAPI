<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Вложения - Рабочая панель</title>
    <link rel="stylesheet" href="../css/attachments.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
<div class="container-card">
    <nav>
        <ul>
            <li><a href="attachments.html" class="active">Вложения</a></li>
            <li><a href="../../categories/pages/categories.html">Категории</a></li>
            <li><a href="../../feedbacks/pages/feedbacks.html">Отзывы</a></li>
            <li><a href="../../responses/pages/responses.html">Ответы</a></li>
            <li><a href="../../roles/pages/roles.html">Роли</a></li>
            <li><a href="../../statuses/pages/statuses.html">Статусы</a></li>
            <li><a href="../../users/pages/users.html">Пользователи</a></li>
        </ul>
    </nav>

    <h1>Вложения</h1>
    <p>Здесь отображаются файлы, прикреплённые к отзывам.</p>

    <div class="filter-bar">
        <input type="text" id="searchTerm" placeholder="Поиск по типу и имени файла" />
        <select id="sortColumn">
            <option value="Id">По идентификатору</option>
            <option value="FileType">Тип файла</option>
            <option value="CreatedAt">Дата создания</option>
        </select>
        <select id="sortOrder">
            <option value="asc">По возрастанию</option>
            <option value="desc">По убыванию</option>
        </select>
        <button id="filterBtn">Применить</button>
    </div>

    <div class="attachment-list">
        <p>Загрузка вложений...</p>
    </div>

    <div class="pagination"></div>

    <div>
        <button class="return-buttons" onclick="location.href='../../index.html'">Вернуться</button>
        <button class="create-buttons" onclick="location.href='attachment-create.html'">Добавить вложение</button>
    </div>
</div>

<script src="../js/attachments.js"></script>
</body>
</html>
