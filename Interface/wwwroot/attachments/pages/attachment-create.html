<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Создать вложение - Рабочая панель</title>
    <link rel="stylesheet" href="../css/attachments.css" />
</head>
<body>
<div class="container-card">
    <h1>Создание вложения</h1>
    <form id="attachmentForm">
        <p>Выберите отзыв:</p><br />
        <div id="feedbackList"></div><br />

        <div class="custom-file-input">
            <strong><span id="fileName">Файл не выбран</span></strong><br />
            <button type="button" id="fileSelectBtn">Выбрать файл</button>
            <input type="file" id="fileInput" name="fileInput" style="display:none;" required>
        </div>

        <button type="button" class="return-buttons" onclick="location.href='attachments.html'">Вернуться</button>
        <button type="submit" class="create-buttons">Отправить</button>
    </form>

    <div id="formMessage"></div>
</div>

<script src="../js/attachment-create.js"></script>
</body>
</html>
