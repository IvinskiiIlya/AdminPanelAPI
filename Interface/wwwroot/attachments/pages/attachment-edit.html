<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Редактировать вложение - Рабочая панель</title>
    <link rel="stylesheet" href="../css/attachments.css" />
</head>
<body>
<div class="container-card">
    <h1>Редактирование вложения</h1>
    <form id="attachmentForm">
        <input type="hidden" id="id" name="id" />

        <label for="feedbackId">ID Отзыва:</label><br />
        <input type="number" id="feedbackId" name="feedbackId" required><br /><br />

        <label for="filePath">Путь к файлу:</label><br />
        <input type="text" id="filePath" name="filePath" required><br /><br />

        <label for="fileType">Тип файла:</label><br />
        <input type="text" id="fileType" name="fileType" required><br /><br />

        <button type="button" class="return-buttons" onclick="location.href='attachments.html'">Вернуться</button>
        <button type="submit" class="create-buttons">Сохранить</button>
    </form>
    <div id="formMessage"></div>
</div>

<script src="../js/attachment-edit.js"></script>
</body>
</html>
