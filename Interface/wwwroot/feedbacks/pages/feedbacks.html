<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Отзывы - Рабочая панель</title>
    <link rel="stylesheet" href="../css/feedbacks.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
<div class="container-card">
    <nav>
        <ul>
            <li><a href="../../attachments/pages/attachments.html">Вложения</a></li>
            <li><a href="../../categories/pages/categories.html">Категории</a></li>
            <li><a href="feedbacks.html" class="active">Отзывы</a></li>
            <li><a href="../../responses/pages/responses.html">Ответы</a></li>
            <li><a href="../../roles/pages/roles.html">Роли</a></li>
            <li><a href="../../statuses/pages/statuses.html">Статусы</a></li>
            <li><a href="../../users/pages/users.html">Пользователи</a></li>
        </ul>
    </nav>

    <h1>Отзывы</h1>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Поиск:</label>
            <input type="text" id="searchTerm" placeholder="Поиск по тексту или пользователю..." />
        </div>

        <div class="filter-group filter-row">
            <div class="filter-subgroup">
                <label>Категории и статусы:</label>
                <select id="categoryId">
                    <option value="">Все категории</option>
                </select>
                <select id="statusId">
                    <option value="">Все статусы</option>
                </select>
            </div>
            <div class="filter-subgroup date-group">
                <label>Дата:</label>
                <input type="date" id="createdFrom" placeholder="Дата от" />
                <input type="date" id="createdTo" placeholder="Дата до" />
            </div>
        </div>

        <div class="filter-group">
            <label>Сортировка:</label>
            <select id="sortColumn">
                <option value="Id">По идентификатору</option>
                <option value="CreatedAt">По дате</option>
                <option value="Message">По тексту</option>
            </select>
            <select id="sortOrder">
                <option value="asc">По возрастанию</option>
                <option value="desc">По убыванию</option>
            </select>
        </div>
    </div>
    
    <div class="filter-buttons">
        <button id="resetBtn" type="button">Сбросить фильтры</button>
        <button id="filterBtn">Применить</button>
    </div>

    <div class="feedback-list">
        <p>Загрузка отзывов...</p>
    </div>

    <div class="pagination"></div>

    <div>
        <button class="return-buttons" onclick="location.href='../../index.html'">Вернуться</button>
        <button class="create-buttons" onclick="location.href='feedback-create.html'">Написать отзыв</button>
    </div>
</div>

<script src="../js/feedbacks.js"></script>
</body>
</html>
