<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Создать новый статус</title>
    <link rel="stylesheet" href="./statuses/css/statuses.css" />
</head>

<body>
<div class="container-card">
    <h1>Создать новый статус</h1>
    <form id="status-form">
        <label for="name">Название статуса</label>
        <input type="text" id="name" name="name" maxlength="100" placeholder="Новый" required autofocus />
        <button type="button" id="save-button">Сохранить</button>
    </form>
    <a href="./statuses/pages/statuses.html" class="back-link">← Вернуться к списку статусов</a>
</div>
</body>
</html>
